site_name: BMS Part Tuner
site_url: https://app.kyokufu.blog/
repo_url: https://github.com/bms-atelier-kyokufu/BmsPartTuner
site_dir: site

theme:
  name: material
  language: ja
  logo: img/BmpPartTunerLogo_dark.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - markdown_gfm_admonition

extra_javascript:
  - javascripts/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js

nav:
  - ホーム: index.md
  - やさしい解説書: casual_guide.md
  - 技術解説書:
      - 概要: teach/index.md
      - 1. bmsonからBMSへの変換: teach/01_bmson_to_bms_conversion.md
      - 2. 無音トリミング: teach/02_silence_trimming.md
      - 3. LSHとSIMDの限界: teach/03_lsh_and_simd_limits.md
      - 4. 音声の同値性とピアソンの積率相関係数: teach/04_audio_equivalence_and_pearson.md
      - 5. FFTを用いたタイムアライメント: teach/05_fft_alignment.md
      - 6. Union-Findによるグループ化: teach/06_union_find.md
      - 7. 時間軸シミュレーションエンジン: teach/07_simulation_engine.md
      - 8. 並列処理とメモリプール: teach/08_parallelism_and_memory_pooling.md
