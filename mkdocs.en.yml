site_name: BMS Part Tuner
site_url: https://bms-atelier-kyokufu.github.io/BmsPartTuner/en/
repo_url: https://github.com/bms-atelier-kyokufu/BmsPartTuner
site_dir: site/en

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  alternate:
    - name: English
      link: ./
      lang: en
    - name: 日本語
      link: ../
      lang: ja

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details

extra_javascript:
  - javascripts/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js

nav:
  - Home: index_en.md
  - Portfolio Summary: PORTFOLIO_SUMMARY_EN.md
  - Architecture: 00_ARCHITECTURE_EN.md
  - Technical Guide: 01_TECHNICAL_GUIDE_EN.md
  - Optimization Report: 02_OPTIMIZATION_GUIDE_EN.md
  - Test Strategy: 04_TEST_STRATEGY_EN.md
  - Commit Guide: COMMIT_MESSAGE_GUIDE_EN.md
