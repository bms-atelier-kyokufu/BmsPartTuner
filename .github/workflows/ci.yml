name: Build Verification

on:
  push:
    branches: [ "main", "develop" ] # 監視対象ブランチへのプッシュ
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.props'
  pull_request:
    branches: [ "main", "develop" ] # プルリクエスト作成時
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.props'
  workflow_dispatch: # GitHub上で手動実行を可能にする
  workflow_call: # gh-pages等の他ワークフローからの呼び出しを許可する

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Check
    runs-on: windows-latest # WPFアプリケーションのビルドに必要な Windows SDK のために windows-latest を指定

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # .NET 10 を明示的に指定

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        # --no-incremental: 毎回フルビルドを行うことで、キャッシュによる「たまたま成功」を防ぐ
        run: dotnet build --configuration Release --no-restore --no-incremental

      - name: Test
        # --no-build: ビルド済みの成果物を再利用し、テスト実行のみを行う
        run: dotnet test --configuration Release --no-build --verbosity normal
